<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF8F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B1A18" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Body Clues">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Body Clues</title>
<style>
/* Layout: sticky header with the day, a chronological day timeline, three big log buttons pinned to the bottom, full-screen sheets for each entry type. Palette follows the Intention Net planners: warm paper, quiet ink, one calm teal, with red for symptoms and amber for bathroom. */
:root{
  --paper:#FBF8F3; --box:#F1EBE0; --line:#DDD6CA; --ink:#2B2A28; --sub:#6B6660;
  --accent:#2F7A72; --accent-soft:#E0EEEB; --on-accent:#FFFFFF;
  --symp:#B24A3A; --symp-soft:#F6E5E1; --on-symp:#FFFFFF;
  --bm:#8A6420; --bm-soft:#F2E8D0; --on-bm:#FFFFFF;
  --drink:#35639E; --drink-soft:#E2EAF4; --on-drink:#FFFFFF;
  --sleep:#5B5BA6; --sleep-soft:#E7E7F5; --on-sleep:#FFFFFF;
  --scrim:rgba(43,42,40,.45);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1B1A18; --box:#262420; --line:#3A3733; --ink:#EDE7DD; --sub:#A39C92;
    --accent:#5FB5AA; --accent-soft:#1F3430; --on-accent:#0F211E;
    --symp:#E58C7C; --symp-soft:#3A2420; --on-symp:#2A1410;
    --bm:#D9AE5B; --bm-soft:#352B17; --on-bm:#241A07;
    --drink:#7FB0E0; --drink-soft:#1E2B3A; --on-drink:#0E1B2A;
    --sleep:#A9A9EC; --sleep-soft:#25253F; --on-sleep:#14142B;
    --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1B1A18; --box:#262420; --line:#3A3733; --ink:#EDE7DD; --sub:#A39C92;
  --accent:#5FB5AA; --accent-soft:#1F3430; --on-accent:#0F211E;
  --symp:#E58C7C; --symp-soft:#3A2420; --on-symp:#2A1410;
  --bm:#D9AE5B; --bm-soft:#352B17; --on-bm:#241A07;
    --drink:#7FB0E0; --drink-soft:#1E2B3A; --on-drink:#0E1B2A;
    --sleep:#A9A9EC; --sleep-soft:#25253F; --on-sleep:#14142B;
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:30}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--a,var(--accent));outline-offset:2px}
.in{width:100%;max-width:640px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:12px 8px}
h1{margin:0;font-size:20px;font-weight:750;letter-spacing:-.01em}
.icon-btn{width:44px;height:44px;margin-right:-10px;border:0;background:transparent;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--sub)}
.icon-btn:active{background:var(--box)}
.seg{display:flex;border:1.5px solid var(--accent);border-radius:999px;overflow:hidden;margin-bottom:10px}
.seg button{flex:1;border:0;background:transparent;padding:8px 6px;font-weight:700;font-size:14px;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.daynav{display:flex;align-items:center;gap:6px;padding-bottom:10px}
.nav{width:44px;height:44px;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;font-size:22px;font-weight:700;line-height:1;color:var(--ink)}
.nav:disabled{opacity:.35}
.dlabel{position:relative;flex:1;min-width:0;display:flex;align-items:center;justify-content:center;height:44px;border-radius:12px;background:var(--box);font-weight:700;font-size:16px}
.dlabel input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}

/* timeline */
main.in{padding-block:4px calc(116px + env(safe-area-inset-bottom,0px))}
.daysum{font-size:13px;color:var(--sub);padding:12px 0 6px}
.tl{list-style:none;margin:0;padding:0}
.ev{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer;scroll-margin-top:180px;scroll-margin-bottom:130px}
.ev:active{background:var(--box)}
.tm{font-variant-numeric:tabular-nums;font-weight:750;font-size:15px;line-height:1.2}
.tm span{display:block;font-size:11px;font-weight:750;color:var(--sub);letter-spacing:.05em}
.kind{font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase}
.k-food{color:var(--accent)} .k-symptom{color:var(--symp)} .k-bm{color:var(--bm)} .k-drink{color:var(--drink)} .k-sleep{color:var(--sleep)} .k-pain{color:var(--symp)}
.ttl{font-size:16px;font-weight:650;margin-top:2px;overflow-wrap:anywhere}
.det{font-size:13px;color:var(--sub);margin-top:3px;overflow-wrap:anywhere}
.det b{color:var(--ink)}
.since{font-size:13px;margin-top:6px;overflow-wrap:anywhere}
.since b{font-variant-numeric:tabular-nums}
.since span{color:var(--sub)}
.pill{display:inline-block;font-size:12px;font-weight:650;padding:2px 10px;border-radius:999px;margin:7px 6px 0 0;font-variant-numeric:tabular-nums}
.p-symp{background:var(--symp-soft);color:var(--symp)}
.p-bm{background:var(--bm-soft);color:var(--bm)}
.empty{padding:44px 8px;text-align:center;color:var(--sub);line-height:1.55}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.status{font-size:12.5px;color:var(--sub);padding:18px 0 0;text-align:center}

/* dots */
.dots{display:inline-flex;gap:3px;vertical-align:middle;margin-left:4px}
.dots i{width:7px;height:7px;border-radius:50%;border:1.5px solid currentColor;opacity:.55}
.dots i.f{background:currentColor;opacity:1}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar .grid{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;border:0;border-radius:14px;font-weight:750;font-size:12.5px}
.act:active{filter:brightness(.92)}
.a-food{background:var(--accent);color:var(--on-accent)}
.a-symptom{background:var(--symp);color:var(--on-symp)}
.a-bm{background:var(--bm);color:var(--on-bm)}
.a-drink{background:var(--drink);color:var(--on-drink)}
.a-sleep{background:var(--sleep);color:var(--on-sleep)}
.slbtns{display:flex;gap:8px;align-items:center;padding:14px 0 6px}
.slbtns .act{flex:1;flex-direction:row;gap:8px;font-size:16px}
.slcard{border:1.5px solid var(--line);border-radius:16px;padding:14px;margin:8px 0 4px;background:var(--box)}
.slh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sll{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--sleep)}
.sln b{font-size:28px;font-variant-numeric:tabular-nums;font-weight:780}
.sls{font-size:13px;color:var(--sub);margin-top:4px;overflow-wrap:anywhere}
.sbar{height:8px;border-radius:4px;background:var(--line);margin-top:8px;overflow:hidden}
.sbar i{display:block;height:100%;background:var(--sleep);border-radius:4px}
.pgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:8px}
.pgrid .chip{justify-content:center;min-height:50px;font-size:17px;padding:4px}
.pword{font-size:14px;margin-top:10px;min-height:20px}
.pword b{font-variant-numeric:tabular-nums}
.slpain{display:flex;flex-wrap:wrap;gap:8px;padding:2px 0 4px}
.slavg{font-size:13px;color:var(--sub);padding:12px 0 2px}

/* chips and fields */
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 14px;border:1.5px solid var(--line);background:var(--paper);border-radius:999px;font-weight:650;font-size:14px;color:var(--ink);text-align:left}
.chip.on{background:var(--a,var(--accent));border-color:var(--a,var(--accent));color:var(--on-a,var(--on-accent))}
.chip.small{min-height:36px;padding:4px 12px;font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.lab{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--sub);margin:18px 0 8px}
.hint{font-size:12.5px;color:var(--sub);margin:8px 0 0}
.fld{width:100%;min-height:46px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--box);color:var(--ink);font:inherit;font-size:16px}
textarea.fld{min-height:84px;resize:vertical;line-height:1.4}
.fld:focus{border-color:var(--a,var(--accent));background:var(--paper);outline:none}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;background:var(--paper);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .22s ease;--a:var(--accent);--on-a:var(--on-accent);--a-soft:var(--accent-soft)}
.sheet.show{transform:none}
.sheet[data-type="symptom"]{--a:var(--symp);--on-a:var(--on-symp);--a-soft:var(--symp-soft)}
.sheet[data-type="bm"]{--a:var(--bm);--on-a:var(--on-bm);--a-soft:var(--bm-soft)}
.sheet[data-type="drink"]{--a:var(--drink);--on-a:var(--on-drink);--a-soft:var(--drink-soft)}
.sheet[data-type="pain"]{--a:var(--symp);--on-a:var(--on-symp);--a-soft:var(--symp-soft)}
.sheet[data-type="sleep"]{--a:var(--sleep);--on-a:var(--on-sleep);--a-soft:var(--sleep-soft)}
.sheet:focus{outline:none}
.sh-head{display:grid;grid-template-columns:84px minmax(0,1fr) 84px;align-items:center;padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sh-head h2{margin:0;font-size:16px;font-weight:750;text-align:center}
.sh-cancel{justify-self:start;border:0;background:transparent;min-height:44px;padding:0 6px;font-weight:650;color:var(--sub);font-size:15px}
.sh-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-block:6px 28px}
.sh-foot{border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sh-foot .grid{max-width:640px;margin:0 auto;display:flex;gap:8px}
.primary{flex:1;min-height:52px;border:0;border-radius:14px;background:var(--a);color:var(--on-a);font-weight:750;font-size:16px}
.primary:active{filter:brightness(.92)}
.ghost{min-height:52px;padding:0 16px;border:1.5px solid var(--line);background:transparent;border-radius:14px;font-weight:700;font-size:14px;color:var(--sub)}
.ghost.danger{border-color:var(--symp);color:var(--symp)}
.ghost.armed{background:var(--symp);color:var(--on-symp)}

/* time block */
.tbox{background:var(--box);border-radius:14px;padding:10px 12px;margin-top:8px}
.tbig{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.t1{font-size:26px;font-weight:780;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.t2{font-size:13px;color:var(--sub)}
.mini{font-size:12px;font-weight:800;color:var(--sub);align-self:center;text-transform:uppercase;letter-spacing:.06em;min-width:34px}
.timein{position:relative}
.timein input,.dayin input{border:0;background:transparent;font:inherit;font-weight:650;color:inherit;width:auto;min-width:0;padding:0}
.ctx{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:13px}
.ctx b{font-variant-numeric:tabular-nums}
.ctx span{color:var(--sub)}

.tline{display:flex;align-items:center;gap:10px}
.tline .t1{font-size:20px;flex:0 1 auto}
.tline .t2{flex:1;min-width:0;font-size:13px;color:var(--sub)}
.water{background:var(--box);border-radius:14px;padding:12px 14px;margin-top:12px}
.wh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.wl{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--drink)}
.wn{font-variant-numeric:tabular-nums;color:var(--sub);font-size:14px}
.wn b{color:var(--ink);font-size:20px}
.wbar{height:8px;border-radius:4px;background:var(--line);margin-top:8px;overflow:hidden}
.wbar i{display:block;height:100%;background:var(--drink);border-radius:4px}
.wf{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}
.ws{font-size:12.5px;color:var(--sub);font-variant-numeric:tabular-nums}
.wq{display:flex;flex-wrap:wrap;gap:6px}
.water .chip{border-color:var(--drink);color:var(--drink)}
/* plate and tiles */
.plate{list-style:none;margin:0 0 10px;padding:0;border-top:1px solid var(--line)}
.pl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.pl .nm{font-weight:650;overflow-wrap:anywhere}
.pl .dt{font-size:12.5px;color:var(--sub);overflow-wrap:anywhere}
.step{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:999px;background:var(--paper)}
.step button{width:42px;height:42px;border:0;background:transparent;font-size:21px;font-weight:700;border-radius:50%}
.step .q{min-width:58px;text-align:center;font-weight:750;font-variant-numeric:tabular-nums;font-size:14px;padding:0 2px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 10px}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tw{display:inline-flex;align-items:stretch;gap:4px;max-width:100%}
.dd{display:grid;gap:8px}
.szrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.dd select.fld{min-height:48px}
.minus{min-width:48px;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;font-size:22px;font-weight:700;color:var(--sub)}
.tile{display:flex;flex-direction:column;align-items:flex-start;text-align:left;min-height:48px;padding:8px 14px;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;max-width:100%}
.tile .n{font-weight:700;font-size:14.5px;overflow-wrap:anywhere}
.tile .s{font-size:12px;color:var(--sub);max-width:230px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .c{font-style:normal;font-weight:800;color:var(--a);margin-left:6px;font-variant-numeric:tabular-nums}
.tile.on{border-color:var(--a);background:var(--a-soft)}
.tile.ed{border-style:dashed}
.addrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.lform{background:var(--box);border-radius:14px;padding:14px}
.lform h3{margin:0 0 10px;font-size:15px}
.lform label{display:block;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);margin:10px 0 6px}
.lform .btns{display:flex;gap:8px;margin-top:14px}
.lform .btns .chip{flex:1;justify-content:center}

/* bristol */
.bl{list-style:none;margin:0;padding:0}
.bl li{margin:0 0 6px}
.bb{width:100%;display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;align-items:center;text-align:left;min-height:50px;padding:7px 12px;border:1.5px solid var(--line);background:var(--paper);border-radius:12px}
.bb .num{width:32px;height:32px;border-radius:50%;background:var(--box);display:flex;align-items:center;justify-content:center;font-weight:800;font-variant-numeric:tabular-nums}
.bb .l1{font-weight:700}
.bb .l2{font-size:12.5px;color:var(--sub)}
.bb.on{border-color:var(--a);background:var(--a-soft)}
.bb.on .num{background:var(--a);color:var(--on-a)}

/* settings */
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0;margin:0;font-size:15px;font-weight:650;text-transform:none;letter-spacing:0;color:var(--ink)}
.srow input{width:150px}

/* patterns */
.pt{padding:14px 0;border-bottom:1px solid var(--line)}
.pt .h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.pt .nm{font-weight:700;overflow-wrap:anywhere}
.pt .ct{font-size:12.5px;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
.pbar{height:7px;border-radius:4px;background:var(--line);margin-top:8px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--symp);border-radius:4px}
.pt .why{font-size:13px;color:var(--sub);margin-top:6px}
.note{background:var(--box);border-radius:12px;padding:12px 14px;font-size:13.5px;margin-top:12px}
.calm{color:var(--sub);font-size:13.5px;line-height:1.7;overflow-wrap:anywhere}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:max-content;max-width:88vw;text-align:center;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:80}
.toast.show{opacity:1}
.toast.act{pointer-events:auto}
.tundo{margin-left:12px;border:0;background:transparent;color:var(--paper);font-weight:800;text-decoration:underline;min-height:32px;padding:0 4px}
@media (prefers-reduced-motion: reduce){.sheet,.toast{transition:none}}
</style>

</head>
<body>
<header>
  <div class="in">
    <div class="top">
      <h1>Body Clues</h1>
      <button class="icon-btn" id="gear" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      </button>
    </div>
    <div class="seg" role="group" aria-label="View">
      <button id="segLog" aria-pressed="true">Day</button>
      <button id="segSleep" aria-pressed="false">Sleep</button>
      <button id="segPat" aria-pressed="false">Patterns</button>
    </div>
    <div class="daynav" id="daynav">
      <button class="nav" id="prevDay" aria-label="Previous day">&#8249;</button>
      <label class="dlabel"><span id="dayText">Today</span><input type="date" id="dayPick" aria-label="Pick a day"></label>
      <button class="nav" id="nextDay" aria-label="Next day">&#8250;</button>
    </div>
  </div>
</header>

<main class="in" id="main"></main>

<nav class="bar" aria-label="Add an entry">
  <div class="grid">
    <button class="act a-food" data-open="food">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3v7M10 3v7M6 10a2 2 0 0 0 4 0M8 12v9M18 3c-2 1.5-3 4-3 7 0 1.5 1 2.5 3 2.5V21"/></svg>
      Food
    </button>
    <button class="act a-drink" data-open="drink">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg>
      Drink
    </button>
    <button class="act a-symptom" data-open="symptom">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 12 7 12 10 5 14 19 17 12 21 12"/></svg>
      Symptom
    </button>
    <button class="act a-bm" data-open="bm">

<script>
(function(){
"use strict";

/* ---------- constants ---------- */
var LS_KEY = "foodGutLog:v1";
var SLOTS = ["Breakfast","Lunch","Snack","Dinner"];

  {n:1,l:"Hard lumps",d:"Separate hard lumps, hard to pass"},
  {n:2,l:"Lumpy",d:"Lumpy, sausage-shaped"},
  {n:3,l:"Cracked",d:"Sausage shape with cracks on top"},
  {n:4,l:"Smooth",d:"Smooth, soft, snake-like"},
  {n:5,l:"Soft pieces",d:"Soft blobs with clear edges"},
  {n:6,l:"Mushy",d:"Fluffy, ragged pieces"},
  {n:7,l:"Liquid",d:"Watery, no solid pieces"}
];
var BM_FLAGS = ["Urgent","Straining","Painful","Incomplete","Blood seen","Undigested food"];
var DRINKS = ["Water","Coffee","Tea","Juice","Milk","Soda","Sports drink","Broth","Smoothie","Other"];
var OZ = [4, 8, 12, 16, 20, 32];
var DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var ICON_DOWN = "";

/* ---------- small helpers ---------- */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function pad(n){ return n < 10 ? "0" + n : "" + n; }
function uid(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function dayKey(t){ var d = new Date(t); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function keyDate(k){ var p = k.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
function shiftKey(k, n){ var d = keyDate(k); d.setDate(d.getDate() + n); return dayKey(d.getTime()); }
function addDays(t, n){ var d = new Date(t); d.setDate(d.getDate() + n); return d.getTime(); }
function fmtTime(t){ var d = new Date(t), h = d.getHours(); return (h % 12 || 12) + ":" + pad(d.getMinutes()) + " " + (h < 12 ? "AM" : "PM"); }
function shortDate(t){ var d = new Date(t); return MONTHS[d.getMonth()] + " " + d.getDate(); }
function fmtDay(t){ var d = new Date(t); return DAYS[d.getDay()] + ", " + MONTHS[d.getMonth()] + " " + d.getDate(); }
function dayLabel(k){
  var td = dayKey(Date.now());
  if(k === td) return "Today · " + shortDate(keyDate(k).getTime());
  if(k === shiftKey(td, -1)) return "Yesterday · " + shortDate(keyDate(k).getTime());
  return fmtDay(keyDate(k).getTime());
}
function whenDay(t){
  var k = dayKey(t), td = dayKey(Date.now());
  if(k === td) return "Today · " + shortDate(t);
  if(k === shiftKey(td, -1)) return "Yesterday · " + shortDate(t);
  return fmtDay(t);
}
function hhmm(t){ var d = new Date(t); return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
function withTime(t, s){ var d = new Date(t), p = s.split(":"); d.setHours(+p[0], +p[1], 0, 0); return d.getTime(); }
function withDay(t, k){ var o = new Date(t), d = keyDate(k); d.setHours(o.getHours(), o.getMinutes(), 0, 0); return d.getTime(); }
function fmtDur(ms){
  var m = Math.max(0, Math.round(ms / 60000));
  if(m < 60) return m + "m";
  var h = Math.floor(m / 60), r = m % 60;
  if(h < 24) return h + "h" + (r ? " " + r + "m" : "");
  var d = Math.floor(h / 24);
  return d + "d" + (h % 24 ? " " + (h % 24) + "h" : "");
}
function plural(n, w){ return n + " " + w + (n === 1 ? "" : "s"); }
function qtyStr(n){ var w = Math.floor(n), f = n - w; if(f >= 0.5) return w ? w + "½" : "½"; return String(w); }
function unitStr(u, n){ if(!u) return ""; return (n > 1 && u.length > 2 && !/s$/i.test(u)) ? u + "s" : u; }
function itemText(i){
  var q = i.qty || 1, u = (i.kind === "food" || i.kind === "part") ? unitStr(i.unit, q) : "";
  if(i.kind === "order") return (i.detail ? i.detail + ": " : "") + i.name + (q !== 1 ? " ×" + qtyStr(q) : "");
  if(u) return i.name + " ×" + qtyStr(q) + " " + u;
  return i.name + (q !== 1 ? " ×" + qtyStr(q) : "");
}
function parseSizes(text){
  return String(text || "").split("\n").map(function(l){ return l.trim(); }).filter(Boolean).map(function(l){
    var m = l.match(/^(.*?)[\s:=-]*(\d+(?:\.\d+)?)\s*(?:oz|ounces?)?\s*$/i);
    return m && parseFloat(m[2]) > 0 ? {n: (m[1] || "").trim() || "Size", oz: parseFloat(m[2])} : null;
  }).filter(Boolean);
}
function sizesText(a){ return (a || []).map(function(z){ return z.n + " " + z.oz; }).join("\n"); }
var DEF_CONT = [{n:"Can",oz:12},{n:"Bottle",oz:20},{n:"Water bottle",oz:16.9},{n:"Glass",oz:8},{n:"Mug",oz:8}];
function contKey(a){ return (a || []).map(function(c){ return c.n + "|" + c.oz; }).join(";"); }
var OLD_CONT_KEY = "Can|12;Bottle|20;Glass|8;Mug|8";
var UNITRE = /^(slices?|pieces?|scoops?|cups?|oz|tbsp|tsp|pumps?|strips?|cloves?)$/i;
function parseComps(text){
  return String(text || "").split("\n").map(function(l){ return l.trim(); }).filter(Boolean).map(function(l){
    var subs = [];
    var q = 1, n = l.match(/^(\d+\s*\/\s*\d+|\d+(?:\.\d+)?|½|¼|¾)\s*(.*)$/);
    if(n){
      var v = n[1];
      q = v === "½" ? 0.5 : v === "¼" ? 0.25 : v === "¾" ? 0.75 : (v.indexOf("/") > -1 ? (parseFloat(v.split("/")[0]) / parseFloat(v.split("/")[1])) : parseFloat(v));
      l = n[2].trim() || l;
    }
    var unit = "", w = l.split(/\s+/);
    if(w.length > 1 && UNITRE.test(w[0])){ unit = w[0].toLowerCase().replace(/s$/, ""); l = w.slice(1).join(" "); }
    return {name: l, qty: q || 1, unit: unit, subs: subs};
  }).filter(function(c){ return c.name; });
}
function compsText(cs){
  return (cs || []).map(function(c){
    var pre = (c.qty && c.qty !== 1) || c.unit ? qtyStr(c.qty || 1) + " " + (c.unit ? c.unit + " " : "") : "";
    return pre + c.name + (c.subs && c.subs.length ? " (" + c.subs.join(", ") + ")" : "");
  }).join("\n");
}
function expandItems(items){
  var out = [], seen = {};
  function add(o){
    var k = (o.name + "|" + (o.unit || "")).toLowerCase();
    if(seen[k] !== undefined){ out[seen[k]].qty = (out[seen[k]].qty || 1) + (o.qty || 1); return; }
    seen[k] = out.length; out.push(o);
  }
  items.forEach(function(it){
    if(it.kind === "order" && it.comps && it.comps.length){
      var m = it.qty || 1, from = (it.detail ? it.detail + ": " : "") + it.name;
      it.comps.forEach(function(c){
        if(c.subs && c.subs.length) c.subs.forEach(function(sb){ add({ref: "", kind: "part", name: sb, qty: 1, unit: "", detail: "", from: from, parent: c.name}); });
        else add({ref: "", kind: "part", name: c.name, qty: (c.qty || 1) * m, unit: c.unit || "", detail: "", from: from});
      });
    }else{ out.push(it); seen[(it.name + "|" + (it.unit || "")).toLowerCase()] = out.length - 1; }
  });
  return out;
}
function foodSummary(e){ return (e.items || []).map(itemText).join(", "); }
function fullLabel(k){ for(var i = 0; i < FULL.length; i++){ if(FULL[i].k === k) return FULL[i].l; } return ""; }

/* ---------- data ---------- */
function sbItem(){
  return {id:"i_starbucks", kind:"order", place:"Starbucks", name:"Turkey bacon, egg and cheese on an English muffin", drink:"Hot chocolate", drinkOz:20, drinkNote:"", drinkSize:"Venti", drinkSizes:[{n:"Short",oz:8},{n:"Tall",oz:12},{n:"Grande",oz:16},{n:"Venti",oz:20},{n:"Venti iced",oz:24}], comps:[{name:"Turkey bacon",qty:2,unit:"",subs:[]},{name:"Egg",qty:1,unit:"",subs:[]},{name:"Cheese",qty:1,unit:"slice",subs:[]},{name:"English muffin",qty:1,unit:"",subs:[]}], uses:0, last:0, drinkComps:[{name:"Hot chocolate",qty:1,unit:"",subs:[]},{name:"Almond milk",qty:1,unit:"",subs:[]},{name:"Peppermint",qty:2,unit:"pump",subs:[]}]};
}
function defaultLib(){
  return {
    items: [
      {id:"i_eggs", kind:"food", name:"Scrambled eggs", unit:"scoop", uses:0, last:0},
      {id:"i_roast", kind:"food", name:"Beef roast", unit:"serving", uses:0, last:0},
      {id:"i_potato", kind:"food", name:"Baby potatoes", unit:"piece", uses:0, last:0},
      {id:"i_squash", kind:"food", name:"Butternut squash", unit:"cup", uses:0, last:0},
      {id:"i_casserole", kind:"meal", name:"Beef casserole", parts:["4 oz meat","3 baby potatoes","½ cup butternut squash"], uses:0, last:0},
      {id:"i_serpent", kind:"order", name:"Bacon cheeseburger with sweet potato fries", place:"Serpent Salt", uses:0, last:0},
      sbItem()
    ],
    settings: {slotTimes:{Breakfast:"08:00", Lunch:"12:30", Snack:"15:30", Dinner:"18:30"}, windowH:12, waterGoal:64, lastDrink:null, seedSb:true, containers: DEF_CONT, sleepGoal:8, lastBed:"", lastWake:"", painMin:5},
    touched: false
  };
}
function plain(v){ return v == null ? v : JSON.parse(JSON.stringify(v)); }
function mergeLib(l){
  var d = defaultLib(), s = plain((l && l.settings) || {}) || {};
  var items = (l && Array.isArray(l.items)) ? plain(l.items) : d.items;
  items.forEach(function(i){ if(i.id === "i_starbucks" && (i.drinkNote === "Venti" || i.drinkNote === "Venti, no whip, no foam" || i.drinkNote === "Venti, almond milk, 2 pumps peppermint, no whip, no foam")) i.drinkNote = "";
    if(i.kind === "order" && i.drinkOz && !(i.drinkSizes && i.drinkSizes.length)){
      if(i.id === "i_starbucks"){ i.drinkSizes = sbItem().drinkSizes; i.drinkSize = "Venti"; i.drinkOz = 20; }
      else { i.drinkSizes = [{n: i.drinkSize || "Usual", oz: i.drinkOz}]; i.drinkSize = i.drinkSizes[0].n; }
    }
    if(i.id === "i_starbucks"){ if(!i.comps) i.comps = sbItem().comps; if(!i.drinkComps){ i.drinkComps = sbItem().drinkComps; } } });
  if(!s.seedSb && !items.some(function(i){ return i.id === "i_starbucks"; })) items.push(sbItem());
  return {
    items: items,
    settings: {slotTimes: Object.assign({}, d.settings.slotTimes, s.slotTimes || {}), windowH: s.windowH || 12, waterGoal: s.waterGoal || 64, lastDrink: s.lastDrink || null, seedSb: true, containers: (Array.isArray(s.containers) && s.containers.length && contKey(s.containers) !== OLD_CONT_KEY) ? s.containers : DEF_CONT, sleepGoal: s.sleepGoal || 8, lastBed: s.lastBed || "", lastWake: s.lastWake || "", painMin: (s.painMin >= 0 && s.painMin <= 10) ? s.painMin : 5},
    touched: !!(l && l.touched)
  };
}
var state = {entries: [], lib: defaultLib(), view: "log", day: dayKey(Date.now()), status: "local"};

function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify({entries: state.entries, lib: state.lib})); }catch(e){} }
function loadLocal(){
  try{
    var r = localStorage.getItem(LS_KEY);
    if(!r) return;
    var p = JSON.parse(r);
    if(p && Array.isArray(p.entries)) state.entries = p.entries;
    if(p && p.lib) state.lib = mergeLib(p.lib);
  }catch(e){}
}

/* ---------- cloud (db capability, private per person) ---------- */
var coll = null, migrated = false, cloudQ = Promise.resolve(), libTimer = null;
function enqueue(fn){ cloudQ = cloudQ.then(fn).catch(function(){ setStatus("error"); }); return cloudQ; }
function putEntry(e){ if(coll) enqueue(function(){ return coll.doc(e.id).set(e); }); }
function delEntry(id){ if(coll) enqueue(function(){ return coll.doc(id).delete(); }); }
function putLib(){
  if(!coll) return;
  clearTimeout(libTimer);
  libTimer = setTimeout(function(){
    enqueue(function(){ return coll.doc("library").set({items: state.lib.items, settings: state.lib.settings}); });
  }, 500);
}
function touchLib(){ state.lib.touched = true; saveLocal(); putLib(); }
function statusText(){
  if(state.status === "cloud") return "Saved to your Claude account, so your other devices see it too.";
  if(state.status === "syncing") return "Syncing to your Claude account…";
  if(state.status === "error") return "Couldn't reach online storage just now. Entries are kept on this device.";
  return "Saved on this device only.";
}
function setStatus(s){
  state.status = s;
  var a = $("status"), b = $("stText");
  if(a) a.textContent = statusText();
  if(b) b.textContent = statusText();
}
function hasLocalData(){ return state.entries.length > 0 || state.lib.touched; }
async function connect(){
  try{
    if(!window.claude || !window.claude.use) return;
    var res = await Promise.all([window.claude.use("user"), window.claude.use("db")]);
    var user = res[0], db = res[1];
    if(!user || !db) return;
    var id = await user.id();
    if(!id) return;
    var c = db.collection("data/users/" + id);
    var timer = setTimeout(function(){ setStatus("error"); }, 10000);
    coll = c;
    setStatus("syncing");
    c.onSnapshot(function(snap){
      clearTimeout(timer);
      var es = [], lib = null;
      snap.docs.forEach(function(d){
        var data = d.data();
        if(!data) return;
        if(d.id === "library") lib = plain(data);
        else if(d.id.indexOf("e_") === 0) es.push(Object.assign(plain(data), {id: d.id}));
      });
      var definitive = !snap.metadata.fromCache;
      if(definitive && !es.length && !lib && !migrated && hasLocalData()){
        migrated = true;
        var mine = state.entries.slice();
        enqueue(async function(){
          for(var i = 0; i < mine.length; i++){ await c.doc(mine[i].id).set(mine[i]); }
          if(state.lib.touched) await c.doc("library").set({items: state.lib.items, settings: state.lib.settings});
        });
        setStatus("cloud");
        return;
      }
      if(es.length || lib || !state.entries.length){
        state.entries = es;
        if(lib) state.lib = mergeLib(lib);
        saveLocal();
        render();
      }
      setStatus(definitive ? "cloud" : "syncing");
    }, function(){ clearTimeout(timer); coll = null; setStatus("error"); });
  }catch(e){ coll = null; setStatus("local"); }
}

/* ---------- entry logic ---------- */
function isReaction(e){
  if(e.type === "symptom") return true;
  if(e.type === "pain") return (e.level || 0) >= (state.lib.settings.painMin || 5);
  if(e.type !== "bm") return false;
  var f = e.flags || [], b = e.bristol || 0;
  return (b && (b <= 2 || b >= 6)) || f.indexOf("Urgent") > -1 || f.indexOf("Painful") > -1 || f.indexOf("Blood seen") > -1;
}
function reactNames(r){
  if(r.type === "pain") return ["Pain " + r.level + "/10"];
  if(r.type === "symptom") return (r.symptoms || []).map(function(s){ return s.k; });
  return [r.bristol ? "Bathroom, type " + r.bristol : "Bathroom"];
}
function lastFoodBefore(t, skipId){
  var best = null;
  state.entries.forEach(function(f){ if(f.type === "food" && f.id !== skipId && f.t < t && (!best || f.t > best.t)) best = f; });
  return best;
}
function dayEntries(k){ return state.entries.filter(function(e){ return dayKey(e.t) === k; }).sort(function(a, b){ return a.t - b.t; }); }
function winMs(){ return state.lib.settings.windowH * 3600000; }
function findItem(id){ for(var i = 0; i < state.lib.items.length; i++){ if(state.lib.items[i].id === id) return state.lib.items[i]; } return null; }
function saveEntry(e){
  var i = -1;
  state.entries.forEach(function(x, n){ if(x.id === e.id) i = n; });
  if(i >= 0) state.entries[i] = e; else state.entries.push(e);
  saveLocal(); putEntry(e);
}
function removeEntry(id){
  state.entries = state.entries.filter(function(x){ return x.id !== id; });
  saveLocal(); delEntry(id);
}

/* ---------- toast ---------- */
var toastTimer = null;
function toast(msg, undo){
  var t = $("toast");
  t.textContent = "";
  var sp = document.createElement("span"); sp.textContent = msg; t.appendChild(sp);
  if(undo){
    var b = document.createElement("button"); b.className = "tundo"; b.textContent = "Undo";
    b.addEventListener("click", function(){ clearTimeout(toastTimer); t.classList.remove("show", "act"); undo(); });
    t.appendChild(b); t.classList.add("act");
  }else{ t.classList.remove("act"); }
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove("show", "act"); }, undo ? 5000 : 2400);
}

/* ---------- render: log ---------- */
function dotsHTML(n){ var h = '<span class="dots" aria-hidden="true">'; for(var i = 1; i <= 3; i++) h += '<i' + (i <= n ? ' class="f"' : '') + '></i>'; return h + '</span>'; }
function sinceHTML(e){
  var f = lastFoodBefore(e.t, e.id);
  if(!f || e.t - f.t > 36 * 3600000) return "";
  var lab = f.slot || "meal";
  return '<div class="since"><b>' + esc(fmtDur(e.t - f.t)) + '</b> after ' + esc(lab.toLowerCase()) + ' <span>' + esc(foodSummary(f)) + '</span></div>';
}
function followHTML(f){
  var W = winMs(), rs = state.entries.filter(function(r){ return isReaction(r) && r.t > f.t && r.t - f.t <= W; }).sort(function(a, b){ return a.t - b.t; });
  if(!rs.length) return "";
  var h = "";
  rs.slice(0, 3).forEach(function(r){
    var nm = r.type === "symptom" ? reactNames(r).slice(0, 2).join(", ") : reactNames(r)[0];
    h += '<span class="pill ' + (r.type === "bm" ? "p-bm" : "p-symp") + '">' + esc(nm) + ' · ' + esc(fmtDur(r.t - f.t)) + '</span>';
  });
  if(rs.length > 3) h += '<span class="pill p-symp">+' + (rs.length - 3) + ' more</span>';
  return h;
}
function evHTML(e){
  var c = new Date(e.t), h = c.getHours();
  var tm = '<div class="tm">' + (h % 12 || 12) + ':' + pad(c.getMinutes()) + '<span>' + (h < 12 ? "AM" : "PM") + '</span></div>';
  var body = "";
  if(e.type === "food"){
    var det = [];
    if(e.fullness) det.push(e.fullness === "full" ? "<b>" + esc(fullLabel(e.fullness)) + "</b>" : esc(fullLabel(e.fullness)));
    if(e.feelings && e.feelings.length) det.push(esc(e.feelings.join(", ")));
    body = '<div class="kind k-food">Food' + (e.slot ? " · " + esc(e.slot) : "") + '</div><div class="ttl">' + esc(foodSummary(e)) + '</div>' +
      (det.length ? '<div class="det">' + det.join(" · ") + '</div>' : '') +
      (e.note ? '<div class="det">' + esc(e.note) + '</div>' : '') + followHTML(e);
  }else if(e.type === "drink"){
    body = '<div class="kind k-drink">Drink</div><div class="ttl">' + esc(e.drink) + (e.size ? ' \u00b7 ' + esc(e.size) : '') + ' \u00b7 ' + fmtOz(e.oz) + ' oz</div>' + ((e.parts && e.parts.length) ? '<div class="det">' + esc(e.parts.map(function(c){ return itemText({kind: "part", name: c.name, qty: c.qty, unit: c.unit}); }).join(", ")) + '</div>' : '') + (e.note ? '<div class="det">' + esc(e.note) + '</div>' : '');
  }else if(e.type === "pain"){
    body = '<div class="kind k-pain">Pain' + (PCHECK[e.check || ""] && e.check ? ' \u00b7 ' + PCHECK[e.check] : '') + '</div><div class="ttl">' + e.level + ' of 10 \u00b7 ' + painWord(e.level) + '</div>' +
      ((e.where && e.where.length) ? '<div class="det">' + esc(e.where.join(", ")) + '</div>' : '') + (e.note ? '<div class="det">' + esc(e.note) + '</div>' : '') + sinceHTML(e);
  }else if(e.type === "sleep"){
    body = '<div class="kind k-sleep">' + (e.nap ? "Nap" : "Sleep") + ' \u00b7 woke up</div><div class="ttl">' + (e.nap ? "Napped " : "Slept ") + esc(fmtDur(slDur(e))) + '</div><div class="det">' + esc(sleepDetail(e)) + '</div>' + (e.note ? '<div class="det">' + esc(e.note) + '</div>' : '');
  }else if(e.type === "symptom"){
    body = '<div class="kind k-symptom">Symptom</div><div class="ttl">' +
      (e.symptoms || []).map(function(s){ return '<span aria-label="' + esc(s.k + ", " + SEV[s.sev - 1].toLowerCase()) + '">' + esc(s.k) + dotsHTML(s.sev) + '</span>'; }).join(' &nbsp;') +
      '</div>' + (e.note ? '<div class="det">' + esc(e.note) + '</div>' : '') + sinceHTML(e);

  S.items.push({ref: it.id, kind: it.kind, name: it.name, qty: 1, unit: it.unit || "",
    detail: it.kind === "order" ? (it.place || "") : (it.kind === "meal" ? (it.parts || []).join("; ") : ""),
    drinkName: it.drink || "", drinkSizes: it.drinkSizes ? plain(it.drinkSizes) : [], drinkSize: it.drinkSize || "", drinkOz: it.drinkOz || 0, drinkNote: it.drinkNote || "", comps: it.comps ? plain(it.comps) : [], drinkComps: it.drinkComps ? plain(it.drinkComps) : []});
}

function saveSheet(){
  var b = $("shSave");
  if(!S){ closeSheet(); toast("That screen had expired. Please try again."); return; }
  if(b.disabled) return;
  b.disabled = true;
  try{ saveSheetInner(); }
  catch(err){ toast("Couldn't save: " + ((err && err.message) || "unknown problem") + ". Nothing was lost."); }
  setTimeout(function(){ b.disabled = false; }, 400);
}
function saveSheetInner(){
  if(!S) return;
  if(S.type === "settings"){ closeSheet(); return; }
  var t = S.live ? Date.now() : S.t, e, drinksAdded = 0;
  if(S.type === "food"){
    if(S.form){
      var ff = S.form;
      if((ff.name || "").trim() || (ff.place || "").trim() || (ff.text || "").trim()){ H.formsave(); if(S.form) return; }
      else { S.form = null; }
    }
    if(!S.items.length){ toast("Add at least one food first"); return; }
    e = {id: S.id || uid("e_"), type: "food", t: t, slot: S.slot || "", items: S.items, fullness: S.fullness, feelings: S.feelings, note: S.note.trim()};
    S.items.forEach(function(it){
      var l = findItem(it.ref);
      if(l){ if(!S.id) l.uses = (l.uses || 0) + 1; if(t > (l.last || 0)) l.last = t; if(it.drinkSize){ l.drinkSize = it.drinkSize; l.drinkOz = it.drinkOz; } }
    });
    touchLib();
    var drinkSrc = S.items;
    e.items = expandItems(S.items);
    if(!S.id){
      drinkSrc.forEach(function(it){
        if(it.drinkName && it.drinkOz > 0){
          var dq = it.qty || 1;
          saveEntry({id: uid("e_"), type: "drink", t: t, drink: it.drinkName, size: it.drinkSize || "", oz: it.drinkOz * dq, note: it.drinkNote || "",
            parts: (it.drinkComps || []).map(function(c){ return {name: c.name, qty: (c.qty || 1) * dq, unit: c.unit || ""}; })});
          drinksAdded++;
        }
      });
    }
  }else if(S.type === "drink"){
    var dn = S.drink === "Other" ? (S.other || "").trim() : S.drink;
    if(!dn){ toast("Name the drink"); return; }
    if(!(S.oz > 0)){ toast("Pick an amount"); return; }
    e = {id: S.id || uid("e_"), type: "drink", t: t, drink: dn, size: S.size || "", oz: S.oz, note: S.note.trim()};
    if(S.id){ state.entries.forEach(function(x){ if(x.id === S.id && x.parts) e.parts = x.parts; }); }
    state.lib.settings.lastDrink = {d: S.drink, oz: S.oz};
    touchLib();
  }else if(S.type === "pain"){
    if(S.level == null){ toast("Tap a number from 0 to 10"); return; }
    e = {id: S.id || uid("e_"), type: "pain", t: t, level: S.level, where: S.where.slice(), check: S.check || "", note: S.note.trim()};
  }else if(S.type === "sleep"){
    var dur = S.t - S.bed;
    if(!(dur > 0)){ toast("Bed time has to be before wake time."); return; }
    if(!S.nap && dur > 16 * 3600000){ toast("That is over 16 hours. Check AM and PM."); return; }
    if(S.nap && dur > 8 * 3600000){ toast("A nap over 8 hours? Check the times."); return; }
    e = {id: S.id || uid("e_"), type: "sleep", t: t, start: S.bed, nap: !!S.nap, quality: S.quality || 0, wakes: S.wakes == null ? null : S.wakes, feel: S.feel || "", flags: S.flags.slice(), note: S.note.trim()};
    if(!S.nap){ state.lib.settings.lastBed = S.bedTod; state.lib.settings.lastWake = hhmm(S.t); touchLib(); }
  }else if(S.type === "symptom"){
    var sy = SYMPTOMS.filter(function(k){ return S.sx[k]; }).map(function(k){ return {k: k, sev: S.sx[k]}; });
    if(!sy.length){ toast("Pick at least one symptom"); return; }
    e = {id: S.id || uid("e_"), type: "symptom", t: t, symptoms: sy, note: S.note.trim()};
  }else{
    e = {id: S.id || uid("e_"), type: "bm", t: t, bristol: S.bristol || 0, flags: S.flags, note: S.note.trim()};
  }
  saveEntry(e);
  state.day = dayKey(t);
  closeSheet();
  try{
    render();
    toast((e.type === "pain" ? "Pain " + e.level + " of 10 saved" : e.type === "sleep" ? "Sleep saved \u00b7 " + fmtDur(e.t - e.start) : "Saved \u00b7 " + fmtTime(t)) + (drinksAdded ? " \u00b7 drink added" : ""));
    var row = document.querySelector('.ev[data-id="' + e.id + '"]');
    if(row) row.scrollIntoView({block: "nearest"});
  }catch(err){
    toast("Saved, but the list couldn't refresh (" + ((err && err.message) || "error") + "). Reopen the page.");
  }
}

var BK_KEY = "foodGutLog:lastBackup";
function backupNote(){

function blobSave(name, text, mime){
  try{
    var u = URL.createObjectURL(new Blob([text], {type: mime}));
    var a = document.createElement("a");
    a.href = u; a.download = name; a.style.display = "none";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(u); }, 1500);
    return true;
  }catch(e){ return false; }
}
async function backupAll(){
  var data = JSON.stringify({app: "body-clues", version: 1, saved: Date.now(), entries: state.entries, items: state.lib.items, settings: state.lib.settings}, null, 1);
  try{
    var dl = await window.claude.use("downloads");
    if(!dl) throw new Error("none");
    await dl.save({filename: "body-clues-backup-" + dayKey(Date.now()) + ".json", data: data});
    try{ localStorage.setItem(BK_KEY, String(Date.now())); }catch(e){}
    var n = $("bkText"); if(n) n.textContent = backupNote();
    toast("Backup saved");
  }catch(err){
    if(err && err.code === "declined") return;
    if(blobSave("body-clues-backup-" + dayKey(Date.now()) + ".json", data, "application/json")){
      try{ localStorage.setItem(BK_KEY, String(Date.now())); }catch(e){}
      var n2 = $("bkText"); if(n2) n2.textContent = backupNote();
      toast("Backup saved"); return;
    }
    try{ await navigator.clipboard.writeText(data); toast("Backup copied as text. Paste it into a note."); }
    catch(e2){ toast("Couldn't save the backup here"); }
  }
}
function restoreFrom(text){
  var p;
  try{ p = JSON.parse(text); }catch(e){ toast("That file isn't a backup"); return; }
  if(!p || (p.app !== "food-gut-log" && p.app !== "body-clues") || !Array.isArray(p.entries)){ toast("That file isn't a backup"); return; }
  var have = {}; state.entries.forEach(function(e){ have[e.id] = 1; });
  var added = 0;
  p.entries.forEach(function(e){
    if(e && e.id && typeof e.t === "number" && !have[e.id]){ state.entries.push(e); have[e.id] = 1; added++; saveLocal(); putEntry(e); }
  });
  var haveI = {}; state.lib.items.forEach(function(i){ haveI[i.id] = 1; });
  var addedI = 0;
  (p.items || []).forEach(function(i){ if(i && i.id && !haveI[i.id]){ state.lib.items.push(i); haveI[i.id] = 1; addedI++; } });
  if(p.settings && !state.lib.touched){ state.lib = mergeLib({items: state.lib.items, settings: p.settings, touched: true}); }
  touchLib();
  saveLocal();
  render();
  toast("Restored " + added + " entries and " + addedI + " saved items");
}
document.addEventListener("change", function(e){
  if(e.target && e.target.id === "restoreFile" && e.target.files && e.target.files[0]){
    var r = new FileReader();
    r.onload = function(){ restoreFrom(String(r.result || "")); };
    r.onerror = function(){ toast("Couldn't read that file"); };
    r.readAsText(e.target.files[0]);
  }
});
async function exportCsv(){
  var rows = [["Date","Time","Type","Meal","What","Amount (oz)","Fullness before eating","Feelings","Symptoms","Stool type","Bathroom notes","Note"]];
  state.entries.slice().sort(function(a, b){ return a.t - b.t; }).forEach(function(e){
    var d = dayKey(e.t), tm = fmtTime(e.t);
    if(e.type === "food") rows.push([d, tm, "Food", e.slot || "", foodSummary(e), "", fullLabel(e.fullness), (e.feelings || []).join("; "), "", "", "", e.note || ""]);
    else if(e.type === "drink") rows.push([d, tm, "Drink", "", e.drink + (e.size ? " (" + e.size + ")" : ""), e.oz, "", "", "", "", "", e.note || ""]);
    else if(e.type === "symptom") rows.push([d, tm, "Symptom", "", "", "", "", "", (e.symptoms || []).map(function(s){ return s.k + " (" + SEV[s.sev - 1].toLowerCase() + ")"; }).join("; "), "", "", e.note || ""]);
    else if(e.type === "pain") rows.push([d, tm, "Pain", "", "", "", "", "", "Pain " + e.level + "/10" + ((e.where || []).length ? " (" + e.where.join("; ") + ")" : ""), "", "", [e.check ? PCHECK[e.check] + " check" : "", e.note || ""].filter(Boolean).join(" | ")]);
    else if(e.type === "sleep") rows.push([d, tm, e.nap ? "Nap" : "Sleep", "", (e.nap ? "Napped " : "Slept ") + fmtDur(slDur(e)) + " (bed " + fmtTime(e.start || e.t) + ")", "", "", e.feel || "", "", "", "", [e.quality ? "Quality: " + SQ[e.quality] : "", e.wakes != null ? wakesLabel(e.wakes) : "", (e.flags || []).join("; "), e.note || ""].filter(Boolean).join(" | ")]);
    else rows.push([d, tm, "Bathroom", "", "", "", "", "", "", e.bristol || "", (e.flags || []).join("; "), e.note || ""]);
  });
  var csv = rows.map(function(r){ return r.map(csvCell).join(","); }).join("\r\n");
  try{
    var dl = await window.claude.use("downloads");
    if(!dl) throw new Error("none");
    await dl.save({filename: "body-clues-" + dayKey(Date.now()) + ".csv", data: "﻿" + csv});
    toast("Spreadsheet saved");
  }catch(err){
    if(err && err.code === "declined") return;
    if(blobSave("body-clues-" + dayKey(Date.now()) + ".csv", "\ufeff" + csv, "text/csv")){ toast("Spreadsheet saved"); return; }
    try{ await navigator.clipboard.writeText(csv); toast("Copied as text. Paste it into a spreadsheet."); }
    catch(e2){ toast("Couldn't save the file here"); }
  }
}

/* ---------- page wiring ---------- */
document.querySelectorAll("[data-open]").forEach(function(b){
  b.addEventListener("click", function(){ openSheet(b.getAttribute("data-open"), null); });
});
$("gear").addEventListener("click", function(){ openSheet("settings", null); });
$("segLog").addEventListener("click", function(){ state.view = "log"; render(); });
$("segPat").addEventListener("click", function(){ state.view = "pat"; render(); window.scrollTo(0, 0); });
$("segSleep").addEventListener("click", function(){ state.view = "sleep"; render(); window.scrollTo(0, 0); });
$("prevDay").addEventListener("click", function(){ state.day = shiftKey(state.day, -1); render(); });
$("nextDay").addEventListener("click", function(){ var td = dayKey(Date.now()); if(state.day < td){ state.day = shiftKey(state.day, 1); render(); } });
$("dayPick").addEventListener("change", function(e){ if(e.target.value){ var td = dayKey(Date.now()); state.day = e.target.value > td ? td : e.target.value; render(); } });
function quickWater(oz, size){
  if(state.day !== dayKey(Date.now())){ openSheet("drink", null, {drink: "Water", oz: oz, size: size || ""}); return; }
  var e = {id: uid("e_"), type: "drink", t: Date.now(), drink: "Water", size: size || "", oz: oz, note: ""};
  saveEntry(e); render();
  toast("Added " + oz + " oz water", function(){ removeEntry(e.id); render(); });
}
$("main").addEventListener("click", function(e){
  var q = e.target.closest("[data-quick]");
  if(q){ quickWater(+q.getAttribute("data-quick"), q.getAttribute("data-size") || ""); return; }
  var op = e.target.closest("[data-open]");
  if(op){ openSheet(op.getAttribute("data-open"), null, {nap: op.hasAttribute("data-nap"), check: op.getAttribute("data-check") || ""}); return; }
  var row = e.target.closest(".ev");
  if(!row) return;
  var en = null;
  state.entries.forEach(function(x){ if(x.id === row.getAttribute("data-id")) en = x; });
  if(en) openSheet(en.type, en);
});
$("main").addEventListener("keydown", function(e){
  if((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("ev")){ e.preventDefault(); e.target.click(); }
});

loadLocal();
render();
connect();
})();
